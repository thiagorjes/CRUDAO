server:
  port: 8081

spring:
  application:
    name: kanban-backend
  profiles:
    active: dev

kanban:
  bootstrap:
    # E-mail do usuário que vira admin global (RF-008, ADR-007) no primeiro login OIDC — sem
    # default em produção, deve ser setado via env var KANBAN_BOOTSTRAP_ADMIN_EMAIL.
    admin-email: ${KANBAN_BOOTSTRAP_ADMIN_EMAIL:}

management:
  endpoints:
    web:
      exposure:
        # RNF-002/RNF-004 (TASK-08.2): "metrics" exposto para tornar visíveis os contadores/timers
        # de kanban.evento.listener.* (reconexões, latência NOTIFY→STOMP) criados na TASK-05.3.
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        # RNF-001/002 (TASK-05.3): pod com listener LISTEN/NOTIFY desconectado (board ou
        # notificações) não deve ser considerado pronto para receber tráfego — sem isso, os
        # HealthIndicator custom ficam visíveis só em /actuator/health, não em /readiness.
        readiness:
          # Nomes sem o sufixo "HealthIndicator" — o Spring Boot registra cada HealthIndicator como
          # HealthContributor sob o nome do bean com esse sufixo removido (achado ao rodar a suíte:
          # "boardEventListenerHealthIndicator" com o sufixo faz o context refresh falhar com
          # NoSuchHealthContributorException).
          include: readinessState,boardEventListener,notificacaoEventListener
