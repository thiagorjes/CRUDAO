services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: crudao-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - ./infra/keycloak/crudao-realm.json:/opt/keycloak/data/import/crudao-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /realms/crudao HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.1' <&3"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16-alpine
    container_name: crudao-postgres
    environment:
      POSTGRES_DB: crudao
      POSTGRES_USER: crudao
      POSTGRES_PASSWORD: crudao
    ports:
      - "5432:5432"
    volumes:
      - crudao-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crudao -d crudao"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./systems/CRUDAO/backend
    container_name: crudao-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: crudao
      DB_USER: crudao
      DB_PASSWORD: crudao
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/crudao
      KEYCLOAK_ISSUER_URI_PUBLIC: http://localhost:8081/realms/crudao
      KEYCLOAK_CLIENT_SECRET: crudao-app-secret-dev
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  frontend:
    build:
      context: ./systems/CRUDAO/frontend
    container_name: crudao-frontend
    environment:
      BACKEND_URL: http://backend:8080
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/crudao
      KEYCLOAK_ISSUER_URI_PUBLIC: http://localhost:8081/realms/crudao
      KEYCLOAK_CLIENT_ID: crudao-app
      KEYCLOAK_CLIENT_SECRET: crudao-app-secret-dev
      APP_BASE_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  crudao-postgres-data:
