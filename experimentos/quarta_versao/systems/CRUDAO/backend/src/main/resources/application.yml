server:
  port: 8081

spring:
  application:
    name: kanban-backend
  profiles:
    active: dev

management:
  endpoint:
    health:
      show-details: always
      show-components: always
      probes:
        enabled: true
      group:
        readiness:
          # Durante a reconexão do listener LISTEN/NOTIFY o pod sai de rotação (TASK-05.3).
          include: readinessState,listenNotify,keycloak
  endpoints:
    web:
      exposure:
        include: health,info,metrics
