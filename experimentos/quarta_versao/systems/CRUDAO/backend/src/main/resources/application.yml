server:
  port: 8081

kanban:
  ws-ticket:
    # Segredo HMAC dos tickets de handshake WebSocket (TASK-07.7). SEM default: produção deve
    # injetar WS_TICKET_SECRET; dev/test/it declaram o seu no application-<profile>.yml. Vazio
    # aqui => o boot falha (WsTicketService valida), nunca sobe com segredo público.
    secret: ${WS_TICKET_SECRET:}

spring:
  application:
    name: kanban-backend
  profiles:
    active: dev

management:
  endpoint:
    health:
      show-details: always
      show-components: always
      probes:
        enabled: true
      group:
        readiness:
          # Durante a reconexão do listener LISTEN/NOTIFY o pod sai de rotação (TASK-05.3).
          include: readinessState,listenNotify,keycloak
  endpoints:
    web:
      exposure:
        include: health,info,metrics
