spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/kanban
    username: kanban
    password: kanban
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        opaquetoken:
          introspection-uri: http://keycloak:8080/realms/kanban-dev/protocol/openid-connect/token/introspect
          client-id: kanban-frontend
          client-secret: kanban-dev-secret
app:
  keycloak:
    issuer-uri: http://localhost:8080/realms/kanban-dev

kanban:
  bootstrap:
    admin-email: admin.teste@crudao.local
  ws-ticket:
    secret: ${WS_TICKET_SECRET:dev-ws-ticket-secret-nao-usar-em-producao}
