spring:
  application:
    name: kanban-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:crudao}
    username: ${DB_USER:crudao}
    password: ${DB_PASSWORD:crudao}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: crudao-app
            client-secret: ${KEYCLOAK_CLIENT_SECRET:crudao-app-secret-dev}
            authorization-grant-type: authorization_code
            scope: openid, profile, email
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/crudao}

# JwtDecoder é definido manualmente em SecurityConfig (não via
# spring.security.oauth2.resourceserver.jwt.issuer-uri): a mesma URL não serve para as duas
# finalidades em ambiente Docker — busca de chaves (JWKS) precisa de uma URL alcançável de dentro
# do container (rede interna), enquanto a validação do claim `iss` precisa da URL pública usada
# pelo browser no /authorize (é essa que o Keycloak estampa no token em fluxos Authorization Code
# — TASK-05.0). Ver crudao.keycloak.* abaixo.
crudao:
  keycloak:
    issuer-uri-interno: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/crudao}
    issuer-uri-publico: ${KEYCLOAK_ISSUER_URI_PUBLIC:${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/crudao}}

server:
  port: 8080

logging:
  file:
    name: logs/kanban-backend.log
  logback:
    rollingpolicy:
      max-file-size: 5MB
      max-history: 10
      total-size-cap: 50MB
